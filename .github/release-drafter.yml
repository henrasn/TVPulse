name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'New Features'
    when: 'labels.feature || labels.enhancement'
    title-regex: '^(feat|feature)(\(.*\))?:.*'
    collapse-after: 3
  - title: 'Bug Fixes'
    when: 'labels.fix'
    title-regex: '^(fix|fixing)(\(.*\))?:.*'
  - title: 'Tests'
    when: 'labels.test'
    title-regex: '^test(\(.*\))?:.*'
  - title: 'Maintenance'
    when: 'labels.chore || labels.refactor || labels.build || labels.ci'
    title-regex: '^(chore|refactor|build|ci)(\(.*\))?:.*'
  - title: 'Documentation'
    when: 'labels.docs'
    title-regex: '^docs(\(.*\))?:.*'

# This section transforms "feature(project): Add..." into "project : Add..."
replacers:
  - search: '/^(feat|feature|fix|test|chore|docs|refactor|build|ci)\((.*)\): (.*)/i'
    replace: '$2 : $3'
  - search: '/^(feat|feature|fix|test|chore|docs|refactor|build|ci): (.*)/i'
    replace: '$2'

change-template: '- $TITLE @$AUTHOR'
template: |
  ## What’s Changed

  $CHANGELOG
